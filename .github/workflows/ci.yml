name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Generated stylesheet is up to date
        run: npm run css && git diff --exit-code src/Skeleton.css
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      # Real-browser checks of the stylesheet, against src and the built bundle.
      - run: npm run test:browser
      - run: npm run test:browser -- --dist
      - name: Package contents
        run: npm pack --dry-run
